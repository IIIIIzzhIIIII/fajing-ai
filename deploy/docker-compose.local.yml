# 本地部署预演：MySQL + 后端 + Caddy（三域名 HTTPS）
# 使用前：
#   1. cd fajing-server && mvn -DskipTests package
#   2. 构建前端（VITE_API_BASE=https://api.fajing.local）
#   3. hosts 写入 127.0.0.1 fajing.local admin.fajing.local api.fajing.local
#   4. docker compose -f deploy/docker-compose.local.yml up -d --build
# 首次启动后端会执行 schema/data 初始化（SQL_INIT_MODE=always）。

name: fajing-local

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fajing123}
      MYSQL_DATABASE: fajing
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: ../fajing-server
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://mysql:3306/fajing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fajing123}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-docker-token-secret-0123456789abcdef}
      PAY_CONFIG_SECRET: ${PAY_CONFIG_SECRET:-local-docker-pay-secret-0123456789abcdef}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-admin12345}
      BASE_URL: https://api.fajing.local
      H5_BASE_URL: https://fajing.local
      CORS_ALLOWED_ORIGINS: https://fajing.local,https://admin.fajing.local
      UPLOAD_DIR: /data/uploads
      CERT_DIR: /data/cert
      LOG_DIR: /data/logs
      SQL_INIT_MODE: always
      PAY_MOCK_ENABLED: "false"
      AUTH_MOCK_ENABLED: "false"
      AUTH_GUEST_ENABLED: "true"
      DEMO_STORE_ENABLED: "true"
    volumes:
      - ../uploads:/data/uploads
      - cert:/data/cert
      - logs:/data/logs
    depends_on:
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ../fajing-uniapp/dist/build/h5:/srv/h5:ro
      - ../fajing-admin/dist:/srv/admin:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  mysql-data:
  cert:
  logs:
  caddy-data:
  caddy-config:
