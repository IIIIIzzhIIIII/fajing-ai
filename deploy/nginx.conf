# 发镜 AI · Nginx 参考配置
# 三个域名各司其职，使用前替换 example.com / 证书路径 / 静态目录 / 白名单 IP：
#   example.com      用户端 H5（公网可访问）
#   admin.example.com 管理端（仅白名单 IP / 内网 / VPN 可访问）
#   api.example.com   后端接口与图片（小程序合法域名也填这个）

# ============ 用户端 H5 ============
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # 用户端 H5 静态站点（前端构建产物 dist/build/h5）
    root /usr/share/nginx/h5;
    index index.html;

    # 管理端不在主域名暴露，避免用户从根路径进到后台
    location ^~ /admin/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============ 管理端 ============
server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 只允许固定出口 IP / 内网 / VPN，其余一律拒绝
    # 把 203.0.113.10 换成你的办公网或家庭固定 IP；动态 IP 可用 VPN 后放行内网段
    allow 203.0.113.10;
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    deny all;

    client_max_body_size 10m;

    # 管理端静态站点（fajing-admin 构建产物 dist）
    root /usr/share/nginx/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============ 后端接口 + 图片 ============
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 与后端 multipart 限制保持一致
    client_max_body_size 10m;

    # 后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 本地存储模式下的图片目录（用对象存储时可删掉）
    location /uploads/ {
        alias /opt/fajing/uploads/;
        expires 7d;
    }

    # 除接口与图片外不对外提供其他内容
    location / {
        return 404;
    }
}
