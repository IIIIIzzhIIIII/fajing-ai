spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/fajing_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

# 测试环境允许演示登录，便于用例直接拿 token
auth:
  mock-enabled: true

token:
  secret: ${TOKEN_SECRET:test-secret-0123456789abcdefghijklmn}

pay:
  mock-enabled: true

# 测试库多次运行会累积当天任务，放宽上限避免用例被限流
quota:
  daily-max: 100

fajing:
  upload-dir: ${java.io.tmpdir}/fajing-test-uploads
  base-url: http://localhost:8081
