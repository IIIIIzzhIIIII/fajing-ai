# 开发 / 测试环境（本地或测试服务器）
auth:
  mock-enabled: ${AUTH_MOCK_ENABLED:true}

admin:
  legacy-token-enabled: ${ADMIN_LEGACY_TOKEN_ENABLED:false}

# 开发/测试环境保留演示店长账号
demo:
  store-enabled: ${DEMO_STORE_ENABLED:true}
  store-username: ${DEMO_STORE_USERNAME:store1}
  store-password: ${DEMO_STORE_PASSWORD:store123}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

storage:
  type: ${STORAGE_TYPE:local}

# 开发环境允许 mock 支付，便于本地联调解锁流程
pay:
  mock-enabled: ${PAY_MOCK_ENABLED:true}

# 开发/测试环境放宽每日生成上限
quota:
  daily-max: ${QUOTA_DAILY_MAX:20}
