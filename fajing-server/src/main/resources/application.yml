server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fajing-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fajing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

fajing:
  upload-dir: E:/项目/AI发型替换/uploads
  base-url: http://localhost:8081
  admin-token: admin-token
  ai:
    # 图像模型（OpenAI 兼容接口）：默认硅基流动 Qwen-Image-Edit，可换成其他兼容服务
    image-base-url: https://api.siliconflow.cn/v1
    image-api-key: sk-oeondzhxjsqgyropdplmckkmazorrunvplusmmnlplxolanv
    image-model: Qwen/Qwen-Image-Edit-2509
    # 文案模型：默认 DeepSeek，用于把模板改写成更专业的编辑指令（可后台关闭）
    text-base-url: https://api.deepseek.com/v1
    text-api-key: sk-6089d4e346bf4939a0c99ad8cf5f9946
    text-model: deepseek-flash
    use-text-enhance: 0
