server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: fajing-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/fajing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 日志目录：logback-spring.xml 读取，生产默认 /opt/fajing/logs
app:
  log-dir: ${LOG_DIR:/opt/fajing/logs}

fajing:
  upload-dir: ${UPLOAD_DIR:E:/项目/AI发型替换/uploads}
  # 支付商户私钥目录：必须在 upload-dir 之外，避免被 /uploads/** 公开下载；留空则用 upload-dir 同级 fajing-cert
  cert-dir: ${CERT_DIR:}
  # 服务对外地址，用于拼接上传图片/回调地址
  base-url: ${BASE_URL:http://localhost:8081}
  # H5 用户端站点地址（与管理端/API 域名分离时配置），用于生成支付宝支付回跳地址；留空则回退 base-url
  h5-base-url: ${H5_BASE_URL:}
  # 旧的固定管理端 token，仅兼容用；默认关闭，改用 /api/admin/login 换取 JWT
  admin-token: ${ADMIN_TOKEN:}
  ai:
    # 图像模型（OpenAI 兼容接口）：默认硅基流动 Qwen-Image-Edit，可换成其他兼容服务
    image-base-url: ${AI_IMAGE_BASE_URL:https://api.siliconflow.cn/v1}
    image-api-key: ${SILICONFLOW_KEY:}
    image-model: ${AI_IMAGE_MODEL:Qwen/Qwen-Image-Edit-2509}
    # 文案模型：默认 DeepSeek，用于把模板改写成更专业的编辑指令（可后台关闭）
    text-base-url: ${AI_TEXT_BASE_URL:https://api.deepseek.com/v1}
    text-api-key: ${DEEPSEEK_KEY:}
    text-model: ${AI_TEXT_MODEL:deepseek-flash}
    use-text-enhance: ${AI_USE_TEXT_ENHANCE:0}

# JWT：密钥必须至少 32 位，未配置环境变量时启动失败
token:
  secret: ${TOKEN_SECRET:}
  expire-days: ${TOKEN_EXPIRE_DAYS:7}

# 支付：未接入微信支付商户前，mock 支付只在非生产环境可用（直接置 paid 并写解锁）
pay:
  mock-enabled: ${PAY_MOCK_ENABLED:false}
  wxpay-enabled: ${WXPAY_ENABLED:false}
  # 支付配置加密口令（至少 32 位），未配置时后台无法保存商户密钥
  config-secret: ${PAY_CONFIG_SECRET:}
  # 微信支付公钥模式（新商户）：回调头 wechatpay-serial 为 PUB_KEY_ID_ 时用它验签
  wechat:
    public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
    public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}

# 单用户每日生成次数上限
quota:
  daily-max: ${QUOTA_DAILY_MAX:5}

# AI 调用成本估算（分/次），用于管理端统计
ai:
  cost-cents-per-call: ${AI_COST_CENTS:20}
  # 上传照片审查用的视觉模型（与图像模型同一服务商）
  vision-model: ${AI_VISION_MODEL:Qwen/Qwen3-VL-8B-Instruct}
  photo-check-enabled: ${AI_PHOTO_CHECK:true}

admin:
  # 初始化管理员密码（仅 admin_user 为空时使用）
  init-password: ${ADMIN_INIT_PASSWORD:}
  legacy-token-enabled: ${ADMIN_LEGACY_TOKEN_ENABLED:false}

# 第一版演示数据：仅本地/开发环境初始化演示店长账号，生产默认关闭
demo:
  store-enabled: ${DEMO_STORE_ENABLED:false}
  store-username: ${DEMO_STORE_USERNAME:store1}
  store-password: ${DEMO_STORE_PASSWORD:store123}

# 登录方式：mock 为演示账号（生产关闭）；guest 为 H5 浏览器匿名账号，生产仍可用
auth:
  mock-enabled: ${AUTH_MOCK_ENABLED:false}
  guest-enabled: ${AUTH_GUEST_ENABLED:true}

# 微信登录（P0-1 使用；未配置时走 mock 登录）
wechat:
  # 小程序 AppID/Secret：wx.login → jscode2session
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  # 公众号（服务号）AppID/Secret：H5 网页授权 → openid，与小程序 AppID 不能混用
  oauth-appid: ${WECHAT_OAUTH_APPID:}
  oauth-secret: ${WECHAT_OAUTH_SECRET:}

# UGC 内容安全已随讨论区下线，相关配置与接口一并移除

# 图片存储：local=本地磁盘，s3=S3 兼容对象存储（阿里云 OSS / 腾讯云 COS / MinIO）
storage:
  type: ${STORAGE_TYPE:local}
  s3:
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:auto}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    prefix: ${S3_PREFIX:fajing}
