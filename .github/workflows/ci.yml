name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（JDK17 + MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: fajing_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn verify
        working-directory: fajing-server
        env:
          DB_USER: root
          DB_PASSWORD: "123456"
          TOKEN_SECRET: ci-test-secret-0123456789abcdefghij
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B verify

  frontend:
    name: 前端构建（Node20）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fajing-uniapp/package-lock.json
      - name: npm ci
        working-directory: fajing-uniapp
        run: npm ci
      - name: build:h5
        working-directory: fajing-uniapp
        env:
          VITE_API_BASE: https://api.example.com
        run: npm run build:h5
